


<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: The card is set in English text. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The card's fonts and layout load before it's captured. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                         <!-- What: Character Set Meta. Why: The card's text has to decode as UTF-8. How: This sits first in the head. -->
		<title>Reese Roofing Social Preview Card</title> <!-- What: Page Title Element. Why: The file should say what it is when opened in a browser. How: This names the card. -->

		<!-- #endregion Document -->


		<!-- #region Card Styles -->

		<style>/* What: Card Style Element. Why: The card is one fixed-size image, styled here from the site's own fonts and tokens. How: This imports the site's font faces and global stylesheet, then lays the card out on the site's scale, keeping literal pixels only where the scale has no step within 10%. */


			@import url( '../../src/styles/fonts.css' );  /* What: Site Fonts Import. Why: The card should be set in the site's own typefaces. How: This loads the site's font faces, whose file paths resolve from fonts.css itself. */
			@import url( '../../src/styles/styles.css' ); /* What: Site Styles Import. Why: The card should read the site's colors and scale rather than copies of them. How: This loads the global tokens and base element styles, which also make 1rem the site's 11px base. */



			/* #region carBodBod */

			.carBodBod { /* What: Card Body Body. Why: The card fills the whole 1,200x630 capture in the site's paper and ink. How: This sizes it in literal pixels, the image's own fixed size, and centers its single column. */


				align-items     : center;
				background      : var( --bac-pag-col ); /* Background Page Color = #f5f2ec */
				color           : var( --tex-mai-col ); /* Text Main Color = #1a1f24 */
				display         : flex;
				font-family     : var( --fon-fam-mai ); /* Font Family Main = 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif */
				height          : 630px;
				justify-content : center;
				overflow        : hidden;
				position        : relative;
				width           : 1200px;


			}
			.carBodBod::before { /* What: Card Body Body Grid Lines. Why: The hero's faint drafting grid ties the card to the site. How: This lays two repeating hairline gradients, one rhythm step apart, across the whole card. */


				background-image : linear-gradient( oklch( from var( --tex-mai-col ) l c h / var( --cdn-pow-010-rec ) ) var( --bor-wid-bas ), transparent var( --bor-wid-bas ) ), linear-gradient( 90deg, oklch( from var( --tex-mai-col ) l c h / var( --cdn-pow-010-rec ) ) var( --bor-wid-bas ), transparent var( --bor-wid-bas ) ); /* Text Main Color = #1a1f24, Core-Design-Number to the Power of 10 Reciprocal ~= 0.060, Border Width Base ~= 1.160px */
				background-size  : calc( var( --ver-rhy-p05 ) * 1rem ) calc( var( --ver-rhy-p05 ) * 1rem ); /* Vertical Rhythm Base Plus 5 ~= 59.447px */
				content          : '';
				inset            : 0;
				position         : absolute;


			}


			/* #region carColDiv */

			.carColDiv { /* What: Card Column Div. Why: Some apps crop the card to its center square, so everything that matters sits inside the middle 630px. How: This stacks the logo and three lines in one centered column above the grid. */


				align-items    : center;
				display        : flex;
				flex-direction : column;
				position       : relative;
				text-align     : center;


			}

			.carLogIma { /* What: Card Logo Image. Why: The full logo is what makes the card recognizable at a glance. How: This sets it at a rhythm step tall enough to lead the card while leaving room for the lines below. */


				display : block;
				height  : calc( var( --ver-rhy-p10 ) * 1rem ); /* Vertical Rhythm Base Plus 10 ~= 242.517px */


			}


			/* #region carTitPar */

			.carTitPar { /* What: Card Title Paragraph. Why: The card's main line says what the site is. How: This sets it large in the display serif. */


				font-family    : var( --fon-fam-sec );     /* Font Family Secondary = 'Fraunces', 'Times New Roman', serif */
				font-size      : var( --fon-siz-p06 );     /* Font Size Base Plus 6 ~= 59.447px */
				letter-spacing : -0.01em;
				line-height    : var( --ver-rhy-m01 );     /* Vertical Rhythm Base Minus 1 = 1 */
				margin         : var( --spa-ver-p02 ) 0 0; /* Spacing Vertical Base Plus 2 ~= 25.572px */


			}

			.carAccEmp { /* What: Card Accent Emphasis. Why: The accent word picks up the logo's navy, as italic accents do on the site. How: This colors it. */


				color : var( --acc-mai-col ); /* Accent Main Color = #1f4e7a */


			}

			/* #endregion carTitPar */


			.carNotPar { /* What: Card Notice Paragraph. Why: The card must say plainly that the company isn't real. How: This sets the notice in muted gray at 40px, large enough to read at thumbnail size, a size the font scale has no step near. */


				color       : var( --tex-mut-col );     /* Text Muted Color = #636871 */
				font-size   : 40px;
				font-weight : 500;
				line-height : 1.2;
				margin      : var( --spa-ver-bas ) 0 0; /* Spacing Vertical Base ~= 14.572px */


			}

			.carBuiPar { /* What: Card Builder Paragraph. Why: The card credits who built the site. How: This sets it in ink at the same size as the notice. */


				font-size   : 40px;
				font-weight : 600;
				line-height : 1.2;
				margin      : var( --spa-ver-m03 ) 0 0; /* Spacing Vertical Base Minus 3 ~= 6.268px */


			}

			/* #endregion carColDiv */

			/* #endregion carBodBod */


		</style>

		<!-- #endregion Card Styles -->


	</head>



	<body class='carBodBod'><!-- What: Card Body Body Element. Why: This is the card itself. How: Its single column holds everything the image shows. -->


		<div class='carColDiv'><!-- What: Card Column Div Element. Why: The card's content sits in one centered column. How: This stacks the logo and the three lines. -->


			<img
				class='carLogIma'

				src='../../src/pages/home/logo-full.svg'

				alt='Reese Roofing'
			/><!-- What: Card Logo Image Element. Why: The full logo identifies the site. How: This loads the same SVG the site's hero shows. -->

			<p class='carTitPar'>A portfolio <em class='carAccEmp'>demo</em></p><!-- What: Card Title Paragraph Element. Why: The main line says what the site is. How: The accent word is italic navy. -->

			<p class='carNotPar'>Not a real business</p><!-- What: Card Notice Paragraph Element. Why: Nobody seeing the card should take Reese Roofing for a real roofer. How: This says so directly. -->

			<p class='carBuiPar'>by techgeek.support</p><!-- What: Card Builder Paragraph Element. Why: The card credits who built the site. How: This names techgeek.support. -->


		</div>


	</body>


</html>
